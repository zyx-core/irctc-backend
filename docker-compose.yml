
services:
  mysql:
    image: mysql:8.0
    container_name: irctc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: irctcdb
      MYSQL_USER: irctcuser
      MYSQL_PASSWORD: irctcpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: irctc-backend
    ports:
      - "5220:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=irctcdb;User=root;Password=rootpassword;
    volumes:
      - ./stations.json:/stations.json
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: irctc-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql_data:
