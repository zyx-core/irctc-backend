<div style="padding: 24px; min-width: 400px; color: #333;">
  <h2 mat-dialog-title style="color: #082b71; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
    <mat-icon style="color: #fb792b;">contact_support</mat-icon> Contact Us
  </h2>
  
  <mat-dialog-content>
    <div style="background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd; line-height: 1.6;">
      <h4 style="color: #082b71; font-weight: bold; margin-top: 0; margin-bottom: 15px;">Customer Care</h4>
      
      <p style="margin-bottom: 10px; display: flex; align-items: flex-start; gap: 10px;">
        <mat-icon style="color: #555; font-size: 20px; width: 20px; height: 20px; margin-top: 2px;">phone</mat-icon>
        <span>
          <strong>Phone Numbers:</strong><br>
          14646 OR 0755-6610661 / 0755-4090600<br>
          <span style="font-size: 12px; color: #666;">(Language: Hindi and English)</span>
        </span>
      </p>

      <p style="margin-bottom: 0; display: flex; align-items: flex-start; gap: 10px;">
        <mat-icon style="color: #555; font-size: 20px; width: 20px; height: 20px; margin-top: 2px;">email</mat-icon>
        <span>
          <strong>Email ID:</strong><br>
          <a href="mailto:care@irctc.co.in" style="color: #082b71; font-weight: bold; text-decoration: none;">care@irctc.co.in</a>
        </span>
      </p>
    </div>
  </mat-dialog-content>
  
  <mat-dialog-actions style="justify-content: flex-end; margin-top: 10px;">
    <button mat-flat-button style="background-color: #082b71; color: white; padding: 0 20px;" (click)="dialogRef.close()">Close</button>
  </mat-dialog-actions>
</div>
