<div style="padding: 24px; text-align: center; min-width: 300px;">
      <h2 mat-dialog-title style="color: #fb792b; font-weight: bold; margin-bottom: 10px;">
        Feature In Progress
      </h2>
      <mat-dialog-content>
        <p style="font-size: 16px; color: #555;">
          The <strong style="color: #082b71;">{{ data.feature }}</strong> feature is currently under development. Please check back later!
        </p>
      </mat-dialog-content>
      <mat-dialog-actions style="justify-content: center; margin-top: 20px;">
        <button mat-flat-button color="primary" (click)="dialogRef.close()" style="background-color: #082b71; color: white;">
          Close
        </button>
      </mat-dialog-actions>
    </div>
