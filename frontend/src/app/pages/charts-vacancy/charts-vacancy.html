<div style="padding: 24px; min-width: 500px;">
  <h2 mat-dialog-title style="color: #082b71; font-weight: bold; margin-bottom: 20px;">
    Charts / Vacancy
  </h2>
  <mat-dialog-content>
    <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-direction: column;">
      <mat-form-field appearance="outline">
        <mat-label>Train Name / Number</mat-label>
        <input matInput [(ngModel)]="trainNo" placeholder="Enter Train Number">
      </mat-form-field>
      
      <mat-form-field appearance="outline">
        <mat-label>Journey Date</mat-label>
        <input matInput [matDatepicker]="picker" [(ngModel)]="journeyDate">
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Boarding Station</mat-label>
        <input matInput [(ngModel)]="boardingStation" placeholder="Enter Station Code">
      </mat-form-field>

      <button mat-flat-button color="primary" (click)="getCharts()" [disabled]="!trainNo || !journeyDate || !boardingStation" style="background-color: #fb792b; height: 50px; font-weight: bold;">
        Get Train Chart
      </button>
    </div>

    <div *ngIf="result" style="background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd; text-align: center;">
      <h4 style="color: #082b71; margin-top: 0;">Chart Status</h4>
      <p style="color: #d32f2f; font-weight: bold;">{{ result }}</p>
      <p style="font-size: 13px; color: #666;">
        Detailed seating charts are generated by the Indian Railways 4 hours prior to departure.
      </p>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions style="justify-content: flex-end;">
    <button mat-button (click)="dialogRef.close()">Close</button>
  </mat-dialog-actions>
</div>
