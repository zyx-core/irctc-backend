<div style="padding: 24px; min-width: 400px;">
      <h2 mat-dialog-title style="color: #082b71; font-weight: bold; margin-bottom: 20px;">
        Book Ticket: {{ data.train.name }}
      </h2>
      <mat-dialog-content>
        <div style="margin-bottom: 15px; color: #666;">
          <p><strong>Train No:</strong> {{ data.train.number }}</p>
          <p><strong>Departure:</strong> {{ data.train.departureTime }}</p>
          <div style="background-color: #f5f8ff; padding: 10px; border-radius: 8px; margin-top: 10px; border: 1px solid #dbe2f9;">
            <p style="margin: 0 0 5px 0;"><strong>Base Fare:</strong> ₹450.00</p>
            <p style="margin: 0 0 5px 0;"><strong>Taxes & Fees (11.11% GST):</strong> ₹50.00</p>
            <hr style="border: 0; border-top: 1px solid #dbe2f9; margin: 8px 0;">
            <p style="margin: 0; font-size: 16px; color: #082b71;"><strong>Total Price:</strong> ₹500.00</p>
          </div>
        </div>

        <form [formGroup]="bookingForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column;">
          <mat-form-field appearance="outline">
            <mat-label>Passenger Name</mat-label>
            <input matInput formControlName="passengerName" required>
          </mat-form-field>
          
          <mat-form-field appearance="outline">
            <mat-label>Passenger Age</mat-label>
            <input matInput formControlName="passengerAge" type="number" required>
          </mat-form-field>

          <button mat-flat-button color="primary" type="submit" [disabled]="!bookingForm.valid" style="background-color: #fb792b; color: white; padding: 10px 0; font-size: 16px;">
            PAY ₹500 & BOOK
          </button>
        </form>
      </mat-dialog-content>
    </div>
