<h2 mat-dialog-title style="background-color: #213d77; color: white; margin: 0; padding: 15px;">Train Schedule Enquiry</h2>
<mat-dialog-content style="padding: 20px;">
  <div style="display: flex; gap: 10px; align-items: baseline;">
    <mat-form-field appearance="outline" style="flex: 1;">
      <mat-label>Enter Train Number</mat-label>
      <input matInput [(ngModel)]="trainNumber" placeholder="e.g. 29857">
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="searchSchedule()" style="height: 54px; margin-bottom: 22px;">Search</button>
  </div>

  <div *ngIf="errorMessage" style="color: red; margin-bottom: 15px;">
    {{ errorMessage }}
  </div>

  <div *ngIf="schedule.length > 0">
    <h3 style="color: #213d77; margin-top: 0;">{{ trainNumber }} - {{ trainName }}</h3>
    
    <table mat-table [dataSource]="schedule" class="mat-elevation-z2 schedule-table">
      <ng-container matColumnDef="stationName">
        <th mat-header-cell *matHeaderCellDef> Station Name </th>
        <td mat-cell *matCellDef="let stop"> {{stop.stationName}} </td>
      </ng-container>

      <ng-container matColumnDef="arrivalTime">
        <th mat-header-cell *matHeaderCellDef> Arrival Time </th>
        <td mat-cell *matCellDef="let stop" [ngStyle]="{'color': stop.arrivalTime === '--' ? '#999' : '#333'}"> {{stop.arrivalTime}} </td>
      </ng-container>

      <ng-container matColumnDef="departureTime">
        <th mat-header-cell *matHeaderCellDef> Departure Time </th>
        <td mat-cell *matCellDef="let stop" [ngStyle]="{'color': stop.departureTime === '--' ? '#999' : '#333'}"> {{stop.departureTime}} </td>
      </ng-container>

      <ng-container matColumnDef="haltTime">
        <th mat-header-cell *matHeaderCellDef> Halt Time </th>
        <td mat-cell *matCellDef="let stop"> {{stop.haltTime}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end" style="padding-bottom: 15px; padding-right: 20px;">
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
