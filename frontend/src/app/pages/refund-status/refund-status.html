<div style="padding: 24px; min-width: 500px;">
  <h2 mat-dialog-title style="color: #082b71; font-weight: bold; margin-bottom: 20px;">
    Refund Status
  </h2>
  <mat-dialog-content>
    <div *ngIf="loading" style="text-align: center; padding: 20px;">
      Loading cancelled tickets...
    </div>
    
    <div *ngIf="!loading && cancelledTickets.length === 0" style="text-align: center; padding: 20px; color: #666;">
      You have no cancelled tickets.
    </div>

    <div *ngIf="!loading && cancelledTickets.length > 0">
      <table class="table table-bordered table-striped" style="width: 100%; border-collapse: collapse;">
        <thead style="background: #f57f17; color: white;">
          <tr>
            <th style="padding: 10px; border: 1px solid #ddd;">PNR</th>
            <th style="padding: 10px; border: 1px solid #ddd;">Passenger</th>
            <th style="padding: 10px; border: 1px solid #ddd;">Date Cancelled</th>
            <th style="padding: 10px; border: 1px solid #ddd;">Refund Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let t of cancelledTickets">
            <td style="padding: 10px; border: 1px solid #ddd;">{{ t.pnr }}</td>
            <td style="padding: 10px; border: 1px solid #ddd;">{{ t.passengerName }}</td>
            <td style="padding: 10px; border: 1px solid #ddd;">{{ t.bookingDate | date:'shortDate' }}</td>
            <td style="padding: 10px; border: 1px solid #ddd; color: green; font-weight: bold;">₹400</td>
          </tr>
        </tbody>
      </table>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions style="justify-content: flex-end;">
    <button mat-button (click)="dialogRef.close()">Close</button>
  </mat-dialog-actions>
</div>
