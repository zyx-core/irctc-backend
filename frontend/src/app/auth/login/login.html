<div style="padding: 24px; min-width: 350px;">
      <h2 mat-dialog-title style="color: #082b71; font-weight: bold; margin-bottom: 20px;">
        LOGIN
      </h2>
      <mat-dialog-content>
        <form [formGroup]="authForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column;">
          
          <mat-form-field appearance="outline">
            <mat-label>Username</mat-label>
            <input matInput formControlName="username" required>
          </mat-form-field>
          
          <mat-form-field appearance="outline">
            <mat-label>Password</mat-label>
            <input matInput formControlName="password" type="password" required>
          </mat-form-field>

          <button mat-flat-button color="primary" type="submit" [disabled]="!authForm.valid" style="background-color: #fb792b; color: white; padding: 10px 0; font-size: 16px;">
            SIGN IN
          </button>
        </form>
      </mat-dialog-content>
      <mat-dialog-actions style="justify-content: center; margin-top: 10px;">
        <button mat-button (click)="goToRegister()" style="color: #082b71;">
          Need an account? Register
        </button>
      </mat-dialog-actions>
    </div>
